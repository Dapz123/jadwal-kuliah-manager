name: Generate Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.3 or v1.2.3)'
        required: true
        type: string

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git tag queries

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog
        run: npm run generate-changelog -- "${{ github.event.inputs.version }}"
        env:
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/changelog/changelog-*.md .changelog-entries/
          git commit -m "docs: changelog for ${{ github.event.inputs.version }}"
        continue-on-error: true # Allow empty commit if no changes

      - name: Push to origin
        run: git push origin HEAD:refs/heads/changelog/${{ github.event.inputs.version }}
        continue-on-error: true # Allow if branch already exists

      - name: Summary
        run: |
          echo "✅ Changelog generated successfully!"
          echo ""
          echo "Version: ${{ github.event.inputs.version }}"
          echo "Branch: changelog/${{ github.event.inputs.version }}"
          echo ""
          echo "Next steps:"
          echo "1. Review the generated changelog at docs/changelog/changelog-${{ github.event.inputs.version }}.md"
          echo "2. Push the branch if not already pushed"
          echo "3. Create a pull request for review"
