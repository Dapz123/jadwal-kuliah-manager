name: Build Linux portable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Build AppImage
        run: npx electron-builder --linux appimage

      - name: Short SHA
        id: meta
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable-${{ steps.meta.outputs.short_sha }}
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 14
